name: build-windows

# Builds the HIDERING daemon (hideringd.exe) for Windows x64 using the
# MSYS2 + mingw-w64 toolchain.
#
# NOTE on liboqs (Phase 5 PQC): the CMake `EXISTS` guard only makes *linking*
# the `oqs` target optional. src/crypto/pqc.cpp still `#include <oqs/oqs.h>`
# unconditionally (compiled into cncrypto, which the daemon links), so liboqs
# must be built before the daemon or compilation fails.
#
# NOTE on generator: the spec asked for `-G "MinGW Makefiles"`, but that
# generator drives mingw32-make and breaks when sh.exe is on PATH (always true
# inside the MSYS2 shell). We use `-G "MSYS Makefiles"` + GNU make under the
# ucrt64 environment instead.
#
# NOTE on STATIC: the spec asked for -DSTATIC=ON, but linking the mandatory
# libunbound statically pulls in unresolved nettle/gmp/hogweed symbols that
# Monero's CMake does not add to the link line. We link dynamically, but the
# daemon and the wallet RPC only import Windows system DLLs; the wallet CLI
# also imports MSYS2 DLLs (ICU, iconv). The package step bundles every DLL
# that ldd resolves under /ucrt64/bin and fails the build if an import is
# neither bundled nor provided by Windows.

on:
  push:
    branches:
      - v2-privacy
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-unbound
            mingw-w64-ucrt-x86_64-zeromq
            git
            pkg-config
            zip

      - name: compute job count
        run: echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: build liboqs (Phase 5 PQC dependency)
        run: |
          cmake -S external/liboqs -B external/liboqs/build -G "MSYS Makefiles" \
            -DBUILD_SHARED_LIBS=OFF -DOQS_USE_OPENSSL=ON -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build external/liboqs/build -j"${JOBS}"

      - name: build daemon
        run: |
          # mingw's static OpenSSL 3 (libcrypto.a) references Win32 socket and
          # cert-store symbols (ws2_32 / crypt32 / bcrypt) that Monero's CMake
          # does not append. CMAKE_*_STANDARD_LIBRARIES are emitted at the very
          # END of the link line, after libcrypto.a, so ld resolves them.
          WIN_SYS_LIBS="-lws2_32 -lcrypt32 -lbcrypt -lgdi32 -liphlpapi"
          # ARCH=default: no -march=native. The runner CPU varies (some have
          # AVX-512); a native build then dies with SIGILL on CPUs without it.
          cmake -S . -B build -G "MSYS Makefiles" \
            -DARCH=default -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DEVICE_TREZOR=OFF -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_C_STANDARD_LIBRARIES="${WIN_SYS_LIBS}" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="${WIN_SYS_LIBS}"
          make -C build -j"${JOBS}" daemon simplewallet wallet_rpc_server

      - name: package
        run: |
          PKG="hidering-windows-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd.exe build/bin/hidering-wallet-cli.exe build/bin/hidering-wallet-rpc.exe "dist/${PKG}/"
          # Bundle the MSYS2 DLLs the executables load at run time. ldd lists the
          # whole dependency chain; only files under /ucrt64/bin are copied, so
          # Windows system DLLs are never bundled.
          for exe in "dist/${PKG}"/*.exe; do
            ldd "$exe" | awk '/\/ucrt64\/bin\//{print $3}'
          done | sort -u > dll-list.txt
          echo "Bundled MSYS2 DLLs:"
          cat dll-list.txt
          while read -r dll; do
            cp "$dll" "dist/${PKG}/"
          done < dll-list.txt
          # Fail if any executable or bundled DLL needs a DLL that is neither
          # in the package nor provided by Windows. api-ms-win-* are Windows
          # API-set stubs and always resolve.
          ls /c/Windows/System32 | tr '[:upper:]' '[:lower:]' | sort -u > system-dlls.txt
          ls "dist/${PKG}" | tr '[:upper:]' '[:lower:]' | sort -u > packaged-files.txt
          missing=0
          for f in "dist/${PKG}"/*.exe "dist/${PKG}"/*.dll; do
            [ -e "$f" ] || continue
            echo "== ${f##*/}"
            objdump -p "$f" | grep "DLL Name" || true
            for d in $(objdump -p "$f" | awk '/DLL Name:/{print $3}'); do
              lc=$(echo "$d" | tr '[:upper:]' '[:lower:]')
              case "$lc" in api-ms-win-*) continue ;; esac
              grep -qxF -- "$lc" packaged-files.txt && continue
              grep -qxF -- "$lc" system-dlls.txt && continue
              echo "MISSING: ${f##*/} needs $d"
              missing=1
            done
          done
          if [ "$missing" != 0 ]; then
            echo "Unresolved DLL imports, refusing to package."
            exit 1
          fi
          # Licence texts of the bundled MSYS2 DLLs: one folder per owning MSYS2
          # package, with its pacman metadata (name, version, URL, licence) and
          # every LICENSE/COPYING/NOTICE file the package installs. A bundled DLL
          # that no package owns fails the build.
          mkdir -p "dist/${PKG}/licenses"
          : > dll-packages.txt
          while read -r dll; do
            pacman -Qqo "$dll" >> dll-packages.txt || {
              echo "No MSYS2 package owns $dll, refusing to package."
              exit 1
            }
          done < dll-list.txt
          sort -u -o dll-packages.txt dll-packages.txt
          echo "Packages owning the bundled DLLs:"
          cat dll-packages.txt
          {
            echo "Licences of the third-party DLLs bundled in this package."
            echo "One folder per MSYS2 package: PACKAGE-INFO.txt gives its name, version,"
            echo "upstream URL and licence; the other files are the licence texts it ships."
          } > "dist/${PKG}/licenses/README.txt"
          while read -r pkg; do
            dest="dist/${PKG}/licenses/${pkg}"
            mkdir -p "$dest"
            pacman -Qi "$pkg" | grep -E '^(Name|Version|URL|Licenses) ' > "$dest/PACKAGE-INFO.txt"
            n=0
            while IFS= read -r f; do
              [ -f "$f" ] || continue
              case "${f##*/}" in
                LICENSE*|LICENCE*|COPYING*|NOTICE*|COPYRIGHT*)
                  cp "$f" "$dest/$(echo "${f#/ucrt64/}" | tr '/' '_')"
                  n=$((n+1)) ;;
              esac
            done < <(pacman -Qql "$pkg")
            echo "${pkg}: ${n} licence file(s)"
            if [ "$n" = 0 ]; then
              echo "::warning::${pkg} ships no LICENSE/COPYING file; only PACKAGE-INFO.txt is bundled"
            fi
          done < dll-packages.txt
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          zip -r "${PKG}.zip" "${PKG}"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hidering-windows-x64
          path: dist/hidering-windows-*

  release:
    name: Attach Windows asset to release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared across all three build-* workflows so their release jobs serialize
    # and softprops create-or-updates the same release without a create race.
    concurrency:
      group: hidering-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hidering-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HIDERING ${{ github.ref_name }}
          # Draft: the release stays unpublished until the maintainer has checked
          # the assets and runs gh release edit <tag> --draft=false. (The tag
          # itself is public as soon as it is pushed.)
          draft: true
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/hidering-windows-*
