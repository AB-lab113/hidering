name: build-windows

# Builds the HIDERING daemon (hideringd.exe) for Windows x64 using the
# MSYS2 + mingw-w64 toolchain.
#
# NOTE on liboqs (Phase 5 PQC): the CMake `EXISTS` guard only makes *linking*
# the `oqs` target optional. src/crypto/pqc.cpp still `#include <oqs/oqs.h>`
# unconditionally (compiled into cncrypto, which the daemon links), so liboqs
# must be built before the daemon or compilation fails.
#
# NOTE on generator: the spec asked for `-G "MinGW Makefiles"`, but that
# generator drives mingw32-make and breaks when sh.exe is on PATH (always true
# inside the MSYS2 shell). We use `-G "MSYS Makefiles"` + GNU make under the
# mingw64 environment instead.
#
# NOTE on STATIC: the spec asked for -DSTATIC=ON, but linking the mandatory
# libunbound statically pulls in unresolved nettle/gmp/hogweed symbols that
# Monero's CMake does not add to the link line. We link dynamically; the
# resulting hideringd.exe needs the mingw64 runtime DLLs alongside it.

on:
  push:
    branches:
      - v2-privacy
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-miniupnpc
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-zeromq
            git
            pkg-config
            zip

      - name: compute job count
        run: echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: build liboqs (Phase 5 PQC dependency)
        run: |
          cmake -S external/liboqs -B external/liboqs/build -G "MSYS Makefiles" \
            -DBUILD_SHARED_LIBS=OFF -DOQS_USE_OPENSSL=ON -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build external/liboqs/build -j"${JOBS}"

      - name: build daemon
        run: |
          # mingw's static OpenSSL 3 (libcrypto.a) references Win32 socket and
          # cert-store symbols (ws2_32 / crypt32 / bcrypt) that Monero's CMake
          # does not append. CMAKE_*_STANDARD_LIBRARIES are emitted at the very
          # END of the link line, after libcrypto.a, so ld resolves them.
          WIN_SYS_LIBS="-lws2_32 -lcrypt32 -lbcrypt -lgdi32 -liphlpapi"
          cmake -S . -B build -G "MSYS Makefiles" \
            -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DEVICE_TREZOR=OFF -DBoost_NO_BOOST_CMAKE=ON \
            -DCMAKE_C_STANDARD_LIBRARIES="${WIN_SYS_LIBS}" \
            -DCMAKE_CXX_STANDARD_LIBRARIES="${WIN_SYS_LIBS}"
          make -C build -j"${JOBS}" daemon simplewallet wallet_rpc_server

      - name: package
        run: |
          PKG="hidering-windows-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd.exe build/bin/hidering-wallet-cli.exe build/bin/hidering-wallet-rpc.exe "dist/${PKG}/"
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          zip -r "${PKG}.zip" "${PKG}"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hidering-windows-x64
          path: dist/hidering-windows-*

  release:
    name: Attach Windows asset to release
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared across all three build-* workflows so their release jobs serialize
    # and softprops create-or-updates the same release without a create race.
    concurrency:
      group: hidering-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hidering-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HIDERING ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/hidering-windows-*
