name: build-macos

# Builds the HIDERING daemon (hideringd) for macOS Apple Silicon / M1
# (macos-14, arm64 only). Intel (macos-13) was dropped: that runner never got
# scheduled on this account across many runs while arm64 built reliably.
# Linked dynamically: -DSTATIC=ON cannot produce a fully static binary on macOS
# (no static libc) and breaks the libunbound link, so deps come from Homebrew
# at runtime.
#
# NOTE on liboqs (Phase 5 PQC): the CMake `EXISTS` guard in external/CMakeLists.txt
# only makes *linking* the `oqs` target optional. src/crypto/pqc.cpp still
# `#include <oqs/oqs.h>` unconditionally and is compiled into cncrypto, which the
# daemon links — so the daemon will NOT compile unless liboqs has been built first.
# We therefore build liboqs (static, OpenSSL-backed, lib-only) before the daemon.

on:
  push:
    branches:
      - v2-privacy
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS arm64 build
    runs-on: macos-14
    env:
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          brew update
          brew install --quiet cmake boost openssl libsodium miniupnpc expat libunwind-headers unbound zeromq

      - name: compute job count
        run: echo "JOBS=$(sysctl -n hw.logicalcpu)" >> "$GITHUB_ENV"

      - name: build liboqs (Phase 5 PQC dependency)
        run: |
          OPENSSL_ROOT="$(brew --prefix openssl)"
          cmake -S external/liboqs -B external/liboqs/build \
            -DBUILD_SHARED_LIBS=OFF -DOQS_USE_OPENSSL=ON -DOQS_BUILD_ONLY_LIB=ON \
            -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}" -DCMAKE_BUILD_TYPE=Release
          cmake --build external/liboqs/build -j"${JOBS}"

      - name: build daemon
        run: |
          OPENSSL_ROOT="$(brew --prefix openssl)"
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DEVICE_TREZOR=OFF -DOPENSSL_ROOT_DIR="${OPENSSL_ROOT}"
          make -j"${JOBS}" daemon

      - name: package
        run: |
          PKG="hideringd-macos-${{ env.ARCH }}"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd "dist/${PKG}/"
          strip "dist/${PKG}/hideringd" || true
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hideringd-macos-${{ env.ARCH }}
          path: dist/hideringd-macos-*

  release:
    name: Attach macOS asset to release
    needs: build-macos
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared across all three build-* workflows so their release jobs serialize
    # and softprops create-or-updates the same release without a create race.
    concurrency:
      group: hidering-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hideringd-macos-arm64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HIDERING ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/hideringd-macos-*
