name: build-linux

# Builds the HIDERING daemon (hideringd) for Linux x64 on Ubuntu 22.04.
# Linked dynamically: -DSTATIC=ON fails because the mandatory static
# libunbound.a needs nettle/gmp/hogweed symbols that Monero's CMake never
# adds to the link line.
#
# NOTE on liboqs (Phase 5 PQC): the CMake `EXISTS` guard only makes *linking*
# the `oqs` target optional. src/crypto/pqc.cpp still `#include <oqs/oqs.h>`
# unconditionally (compiled into cncrypto, which the daemon links), so liboqs
# must be built before the daemon or compilation fails.

on:
  push:
    branches:
      - v2-privacy
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux x64 build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libboost-all-dev libssl-dev libsodium-dev libminiupnpc-dev \
            libunbound-dev libexpat1-dev libunwind8-dev libzmq3-dev git

      - name: compute job count
        run: echo "JOBS=$(nproc)" >> "$GITHUB_ENV"

      - name: build liboqs (Phase 5 PQC dependency)
        run: |
          cmake -S external/liboqs -B external/liboqs/build \
            -DBUILD_SHARED_LIBS=OFF -DOQS_USE_OPENSSL=ON -DOQS_BUILD_ONLY_LIB=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build external/liboqs/build -j"${JOBS}"

      - name: build daemon + wallet
        run: |
          mkdir -p build && cd build
          cmake .. -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DUSE_DEVICE_TREZOR=OFF
          make -j"${JOBS}" daemon simplewallet wallet_rpc_server

      - name: package
        run: |
          PKG="hidering-linux-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd build/bin/hidering-wallet-cli build/bin/hidering-wallet-rpc "dist/${PKG}/"
          strip "dist/${PKG}/hideringd" "dist/${PKG}/hidering-wallet-cli" "dist/${PKG}/hidering-wallet-rpc" || true
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: hidering-linux-x64
          path: dist/hidering-linux-*

  release:
    name: Attach Linux asset to release
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared across all three build-* workflows so their release jobs serialize
    # and softprops create-or-updates the same release without a create race.
    concurrency:
      group: hidering-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hidering-linux-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HIDERING ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/hidering-linux-*
