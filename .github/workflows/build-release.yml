name: build-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v1.0.0) for manual release runs'
        required: true

permissions:
  contents: write

env:
  REMOVE_BUNDLED_PACKAGES: sudo rm -rf /usr/local
  APT_INSTALL_LINUX: 'apt -y install build-essential cargo cmake libboost-all-dev miniupnpc libunbound-dev graphviz doxygen libunwind8-dev pkg-config libssl-dev libzmq3-dev libsodium-dev libhidapi-dev libusb-1.0-0-dev libprotobuf-dev protobuf-compiler ccache curl git'
  APT_SET_CONF: |
    tee -a /etc/apt/apt.conf.d/80-custom << EOF
    Acquire::Retries "3";
    Acquire::http::Timeout "120";
    Acquire::ftp::Timeout "120";
    EOF
  USE_DEVICE_TREZOR_MANDATORY: ON

jobs:
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Linux x86_64 build
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      CCACHE_TEMPDIR: /tmp/.ccache-temp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - uses: ./.github/actions/set-make-job-count
      - name: install dependencies
        run: |
          ${{ env.REMOVE_BUNDLED_PACKAGES }}
          sudo bash -c "${{ env.APT_SET_CONF }}"
          sudo apt update
          sudo ${{ env.APT_INSTALL_LINUX }}
      - name: build
        run: |
          ccache --max-size=300M
          cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=OFF -D CMAKE_BUILD_TYPE=Release -D USE_DEVICE_TREZOR=OFF
          cmake --build build --target daemon simplewallet wallet_rpc_server -j${{ env.MAKE_JOB_COUNT }}
      - name: package
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          PKG="hidering-v${VERSION}-linux-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd "dist/${PKG}/"
          cp build/bin/hidering-wallet-cli "dist/${PKG}/"
          cp build/bin/hidering-wallet-rpc "dist/${PKG}/"
          strip "dist/${PKG}/"hideringd "dist/${PKG}/"hidering-wallet-cli "dist/${PKG}/"hidering-wallet-rpc
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hidering-linux
          path: dist/hidering-*

  build-macos:
    name: macOS x86_64 build
    needs: resolve-tag
    runs-on: macos-latest
    env:
      CCACHE_TEMPDIR: /tmp/.ccache-temp
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - uses: ./.github/actions/set-make-job-count
      - name: install dependencies
        run: |
          brew uninstall cmake || true
          brew update
          brew install --quiet cmake boost hidapi openssl zmq miniupnpc expat libunwind-headers protobuf ccache
      - name: build
        run: |
          ccache --max-size=300M
          cmake -S . -B build -D ARCH="default" -D BUILD_TESTS=OFF -D CMAKE_BUILD_TYPE=Release -D USE_DEVICE_TREZOR=OFF
          cmake --build build --target daemon simplewallet wallet_rpc_server -j${{ env.MAKE_JOB_COUNT }}
      - name: package
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          PKG="hidering-v${VERSION}-macos-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd "dist/${PKG}/"
          cp build/bin/hidering-wallet-cli "dist/${PKG}/"
          cp build/bin/hidering-wallet-rpc "dist/${PKG}/"
          strip "dist/${PKG}/"hideringd "dist/${PKG}/"hidering-wallet-cli "dist/${PKG}/"hidering-wallet-rpc || true
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          tar -czf "${PKG}.tar.gz" "${PKG}"
          shasum -a 256 "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hidering-macos
          path: dist/hidering-*

  build-windows:
    name: Windows x86_64 build
    needs: resolve-tag
    runs-on: windows-latest
    env:
      CCACHE_TEMPDIR: C:\Users\runneradmin\.ccache-temp
      CCACHE_DIR: C:\Users\runneradmin\.ccache
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.ccache
          key: ccache-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-release-${{ runner.os }}-
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            make
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-protobuf
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-unbound
            mingw-w64-x86_64-rust
            git
            pkg-config
            zip
      - uses: ./.github/actions/set-make-job-count
      - name: build
        run: |
          ccache --max-size=300M
          cmake -S . -B build -G "MSYS Makefiles" -D ARCH="default" -D BUILD_TESTS=OFF -D CMAKE_BUILD_TYPE=Release -D USE_DEVICE_TREZOR=OFF -D Boost_NO_BOOST_CMAKE=ON
          cmake --build build --target daemon simplewallet wallet_rpc_server -j${{ env.MAKE_JOB_COUNT }}
      - name: package
        run: |
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          PKG="hidering-v${VERSION}-windows-x64"
          mkdir -p "dist/${PKG}"
          cp build/bin/hideringd.exe "dist/${PKG}/"
          cp build/bin/hidering-wallet-cli.exe "dist/${PKG}/"
          cp build/bin/hidering-wallet-rpc.exe "dist/${PKG}/"
          cp README.md GENESIS_PROOF.md LICENSE "dist/${PKG}/" || true
          cd dist
          zip -r "${PKG}.zip" "${PKG}"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hidering-windows
          path: dist/hidering-*

  release:
    name: Publish GitHub Release
    needs: [resolve-tag, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: find artifacts -type f -printf '%p (%s bytes)\n'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          name: HIDERING ${{ needs.resolve-tag.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/hidering-*.tar.gz
            artifacts/**/hidering-*.tar.gz.sha256
            artifacts/**/hidering-*.zip
            artifacts/**/hidering-*.zip.sha256
